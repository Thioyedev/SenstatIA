upstream api {
    server api:8000;
}

upstream frontend_public {
    server frontend-public:8501;
}

upstream frontend_pro {
    server frontend-pro:8502;
}

# Throttle the API: /query fans out to paid Haiku + Sonnet calls and is
# unauthenticated. 5 r/s is well above a human's pace but caps a hammering
# client; burst absorbs a page that fires a couple of calls at once.
limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # ── Public Streamlit frontend ─────────────────────────────────────────────────
    location / {
        proxy_pass          http://frontend_public;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout  86400s;
    }

    # Streamlit WebSocket (public)
    location /_stcore/ {
        proxy_pass          http://frontend_public/_stcore/;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host $host;
        proxy_read_timeout  86400s;
    }

    # ── Pro Streamlit frontend (/pro) ─────────────────────────────────────────────
    location /pro/ {
        proxy_pass          http://frontend_pro/;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout  86400s;
    }

    # ── REST API (/api) ──────────────────────────────────────────────────────────
    location /api/ {
        limit_req           zone=api burst=10 nodelay;
        rewrite             ^/api(/.*)$ $1 break;
        proxy_pass          http://api;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout  120s;
    }

    # ── Health check ─────────────────────────────────────────────────────────────
    location /health {
        proxy_pass          http://api/health;
        proxy_set_header    Host $host;
    }
}
