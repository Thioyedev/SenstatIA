upstream api {
    server api:8000;
}

upstream frontend_public {
    server frontend-public:8502;
}

upstream frontend_pro {
    server frontend-pro:8501;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # ── Grand Public (root) ──────────────────────────────────────────────────────
    location / {
        proxy_pass          http://frontend_public;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout  90s;
    }

    # Streamlit WebSocket (grand public)
    location /_stcore/ {
        proxy_pass          http://frontend_public;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host $host;
        proxy_read_timeout  86400s;
    }

    # ── Frontend Pro (/pro) ──────────────────────────────────────────────────────
    location /pro/ {
        proxy_pass          http://frontend_pro/;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_read_timeout  90s;
    }

    # Streamlit WebSocket (pro)
    location /pro/_stcore/ {
        proxy_pass          http://frontend_pro/_stcore/;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host $host;
        proxy_read_timeout  86400s;
    }

    # ── REST API (/api) ──────────────────────────────────────────────────────────
    location /api/ {
        rewrite             ^/api(/.*)$ $1 break;
        proxy_pass          http://api;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout  120s;
    }

    # ── Health check ─────────────────────────────────────────────────────────────
    location /health {
        proxy_pass          http://api/health;
        proxy_set_header    Host $host;
    }
}
