[project]
name = "senstat"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24.0",
    "pdfplumber>=0.11.0",
    "camelot-py[cv]>=0.11.0",
    "pdf2image>=1.17.0",
    "pytesseract>=0.3.13",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "sentence-transformers>=3.0.0",
    "chromadb>=0.5.0",
    "rank-bm25>=0.2.2",
    "qdrant-client>=1.9.0",
    "fastembed>=0.3.0",
    "voyageai>=0.3.0",
    "cohere>=5.0.0",
    "mcp>=1.0.0",
    "langgraph>=0.2.0",
    "anthropic>=0.34.0",
    "pandas>=2.2.0",
    "statsmodels>=0.14.0",
    "plotly>=5.22.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "streamlit>=1.38.0",
    "chainlit>=1.3.0",
    "ragas>=0.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agents*", "api*", "frontend*", "frontend_public*", "ingestion*", "vectorstore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: end-to-end tests — require a real ANTHROPIC_API_KEY and indexed ChromaDB",
    "eval: LLM-as-judge evaluation suite",
]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811", "S101"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_strict_optional = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["agents", "api"]
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "@pytest.mark.integration",
]
