services:

  # ── API FastAPI ────────────────────────────────────────────────────────────────
  api:
    build: .
    container_name: senstat-api
    restart: unless-stopped
    command: >
      sh -c "
        python -c 'from sentence_transformers import SentenceTransformer; SentenceTransformer(\"intfloat/multilingual-e5-large\")' &&
        uvicorn api.main:app --host 0.0.0.0 --port 8000
      "
    env_file: .env
    environment:
      - CHROMA_PERSIST_DIR=/app/data/chroma
    volumes:
      - ./data/chroma:/app/data/chroma
      - model_cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # ── Frontend Pro ───────────────────────────────────────────────────────────────
  frontend-pro:
    build: .
    container_name: senstat-frontend-pro
    restart: unless-stopped
    command: >
      streamlit run "frontend/🏠_Accueil.py"
      --server.port 8501
      --server.address 0.0.0.0
      --server.headless true
      --server.baseUrlPath /pro
    environment:
      - API_URL=http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

  # ── Frontend Grand Public ──────────────────────────────────────────────────────
  frontend-public:
    build: .
    container_name: senstat-frontend-public
    restart: unless-stopped
    command: >
      streamlit run "frontend_public/🏠_Accueil.py"
      --server.port 8502
      --server.address 0.0.0.0
      --server.headless true
    environment:
      - API_URL=http://api:8000
    ports:
      - "8502:8502"
    depends_on:
      api:
        condition: service_healthy

  # ── Nginx reverse proxy ────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: senstat-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/senstat.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend-pro
      - frontend-public
      - api

volumes:
  model_cache:
