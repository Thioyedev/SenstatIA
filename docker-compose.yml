services:

  # ── API FastAPI ────────────────────────────────────────────────────────────────
  api:
    build: .
    container_name: senstat-api
    restart: unless-stopped
    command: >
      sh -c "
        python -c 'from sentence_transformers import SentenceTransformer; SentenceTransformer(\"intfloat/multilingual-e5-large\")' &&
        uvicorn api.main:app --host 0.0.0.0 --port 8000
      "
    env_file: .env
    environment:
      - CHROMA_PERSIST_DIR=/app/data/chroma
    volumes:
      - ./data/chroma:/app/data/chroma
      # Path must match HF_HOME in the Dockerfile. Renamed from model_cache when
      # the image stopped running as root: that volume's files are root-owned,
      # and Docker copies ownership from the image only into a new volume.
      - hf_cache:/home/senstat/.cache/huggingface
    # Bound to loopback: nginx reaches these over the compose network by service
    # name, so the host port is only for local debugging. Published on 0.0.0.0 it
    # would be internet-reachable — Docker's iptables rules bypass ufw — exposing
    # the unauthenticated, paid-LLM API past nginx. Same for the two frontends.
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # ── Frontend public Streamlit ──────────────────────────────────────────────────
  frontend-public:
    build: .
    container_name: senstat-frontend-public
    restart: unless-stopped
    command: streamlit run frontend_public/🏠_Accueil.py --server.port 8501 --server.address 0.0.0.0
    env_file: .env
    environment:
      - API_URL=http://api:8000
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8501:8501"
    # Streamlit's own liveness endpoint: says the server is up, not that the
    # API behind it answers — that is the api service's healthcheck.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy

  # ── Frontend pro Streamlit ────────────────────────────────────────────────────
  frontend-pro:
    build: .
    container_name: senstat-frontend-pro
    restart: unless-stopped
    command: streamlit run frontend/🏠_Accueil.py --server.port 8502 --server.address 0.0.0.0
    env_file: .env
    environment:
      - API_URL=http://api:8000
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8502:8502"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8502/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy

  # ── Nginx reverse proxy ────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: senstat-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/senstat.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend-public
      - frontend-pro
      - api

volumes:
  hf_cache:
